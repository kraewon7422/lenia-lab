<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<meta name="description" content="Lenia Lab — continuous cellular automata in your browser (WebGL2).">
<title>Lenia Lab</title>
<style>
:root{
  --bg:#0e0f10; --bg2:#141516; --panel:#141516; --line:rgba(255,248,235,.08); --line2:rgba(255,248,235,.17);
  --text:#ece8df; --muted:#aaa497; --dim:#8e897e; --acc:#f0b44c; --acc2:#8fd0dc; --warn:#ffbe76; --bad:#ff7a86;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:#1b1c1e;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;min-height:34px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#242527}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
.btn.pri{background:var(--acc);color:#241703;border-color:transparent;font-weight:700;min-width:44px}
.btn.pri:hover{background:#f6c66f}
.btn.off{opacity:.38;cursor:not-allowed}
.btn.on{background:rgba(240,180,76,.14);border-color:var(--acc);color:#f6c66f}
.btn.icon{min-width:34px;padding:6px 8px}
select{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;min-height:34px}

#app{display:grid;height:100vh;height:100dvh;grid-template-columns:256px minmax(0,1fr) 292px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "left stage right" "bottom bottom bottom"}
header{grid-area:top;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.14em;font-size:15px;white-space:nowrap}
.brand b{color:var(--acc);font-weight:800}
.ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hright{margin-left:auto;display:flex;gap:6px;align-items:center}
.speed{display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.speed input{width:92px}
.speed output{font-family:var(--mono);color:var(--text);min-width:4.5em;font-size:12px;flex:0 0 auto;white-space:nowrap}

.panel{background:var(--panel);overflow:auto;padding:12px}
#left{grid-area:left;border-right:1px solid var(--line)}
#right{grid-area:right;border-left:1px solid var(--line)}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 10px;font-weight:700}
h2 .sub{letter-spacing:0;text-transform:none;font-weight:400;color:var(--dim);margin-left:6px}
section+section{margin-top:18px}

#gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#18191b;border:1px solid var(--line);border-radius:var(--r);padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.card:hover{border-color:var(--line2)}
.card{position:relative;cursor:pointer}
.card .nmrow{display:flex;align-items:center;gap:4px;min-width:0}
.card .nmrow .nm{flex:1 1 auto;min-width:0}
.card .ren{flex:0 0 auto;min-height:24px;min-width:24px;padding:0;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--muted);font-size:13px}
.card .ren:hover{border-color:var(--line2);color:var(--text)}
.card .renin{width:100%;min-width:0;background:var(--bg2);border:1px solid var(--acc);border-radius:5px;padding:2px 5px;font-size:12px}
.card .cdel{position:absolute;top:4px;right:4px;min-height:24px;min-width:24px;padding:0 6px;border-radius:6px;font-size:13px;line-height:22px;background:#1b1c1e;border:1px solid var(--line2)}
.card .ckind{position:absolute;left:10px;top:10px;font-size:10.5px;background:rgba(14,15,16,.86);border:1px solid var(--line2);border-radius:5px;padding:0 5px;color:var(--text)}
.disc{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.disc .row2{margin-top:6px}
.dbar{height:4px;background:#232427;border-radius:2px;margin-top:8px;overflow:hidden}
.dbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#discView{width:100%;max-width:200px;aspect-ratio:1;border-radius:8px;display:block;margin:8px auto 0;background:#000;image-rendering:auto}
#discFound{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#discFound .card .save{margin-top:2px;min-height:28px;padding:2px 6px;font-size:12px}
.gempty{grid-column:1/-1;font-size:12px;color:var(--muted);margin:2px 0 4px}
.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.card.pick{outline:2px dashed var(--acc2);outline-offset:2px}
.card.pick::after{content:'⊕';position:absolute;right:8px;top:6px;color:var(--acc2);font-size:15px;font-weight:700}
.card canvas{width:100%;aspect-ratio:1;border-radius:6px;display:block;background:#000}
.card .nm{font-size:12px;font-weight:600;line-height:1.25}
.card .lt{font-size:10.5px;color:var(--muted);font-style:italic;line-height:1.2;display:flex;justify-content:space-between;align-items:flex-end;gap:4px}
.card .kbd{flex:0 0 auto;font-style:normal;color:var(--dim);font-family:var(--mono)}

#stage{grid-area:stage;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#070809;min-height:0}
#cv{display:block;touch-action:none;cursor:crosshair;image-rendering:auto}
#info{position:absolute;left:12px;top:12px;max-width:min(360px,calc(100% - 24px));background:#141516;border:1px solid var(--line2);border-radius:var(--r);padding:8px 11px;pointer-events:auto;cursor:pointer}
#info .t{font-weight:700}
#info .t i{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
#info .d{color:#c5ccd8;font-size:12.5px;margin-top:2px}
#info.min .d{display:none}
#badge{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(20,10,14,.82);border:1px solid var(--bad);color:#ffd0d6;border-radius:14px;padding:6px 14px;font-size:13px;display:none;width:max-content;max-width:calc(100% - 24px);text-align:center}
#badge.warn{background:rgba(24,18,8,.82);border-color:var(--warn);color:#ffe4c4}
#viewBtns{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#viewBtns .btn{background:#141516}
#legend{position:absolute;right:12px;bottom:14px;background:#141516;border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--text);display:flex;gap:10px;align-items:center;max-width:calc(100% - 24px)}
#legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#toast{position:absolute;left:50%;bottom:62px;transform:translateX(-50%) translateY(8px);max-width:calc(100% - 24px);white-space:normal;text-align:center;background:#1b1c1e;border:1px solid var(--line2);border-radius:8px;padding:6px 12px;opacity:0;transition:.2s;pointer-events:none;font-size:13px}
#toast.on{opacity:1;transform:translateX(-50%)}

.prow{display:grid;grid-template-columns:30px minmax(0,1fr) 70px;align-items:center;gap:8px;margin:6px 0}
.prow label{font-family:var(--mono);color:var(--muted);font-size:13px}
.prow input[type=number]{-moz-appearance:textfield;appearance:textfield;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:4px 5px;font-family:var(--mono);font-size:12px;text-align:right}
.prow input[type=number]::-webkit-inner-spin-button,.prow input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.prow .pm{grid-column:2/4;font-size:11.5px;color:var(--muted);line-height:1.3;margin:-5px 0 3px}
.rw{position:relative;height:22px;display:flex;align-items:center}
.rw input{width:100%;margin:0}
.rw .tick{position:absolute;top:-1px;width:2px;height:6px;background:var(--acc);border-radius:1px;transform:translateX(-1px);opacity:.85;pointer-events:none}
input[type=range]{accent-color:var(--acc);height:22px}
.hint{color:var(--dim);font-size:11.5px;margin:2px 0 0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .btn{flex:1 1 0;min-width:0;padding:5px 6px;font-size:12.5px}
.rings{display:flex;flex-direction:column;gap:2px}
.subh{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:12px 0 4px;color:var(--muted);font-size:12.5px}
.subh .btn{min-height:28px;padding:2px 8px}
.row2{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.row2 .btn{flex:1 1 auto}

.gbox{background:#111213;border:1px solid var(--line);border-radius:8px;padding:6px 8px 8px;margin-top:8px}
.gbox .gt{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.gbox .gt span:last-child{font-family:var(--mono);color:var(--dim);white-space:nowrap}
.gbox canvas{width:100%;height:96px;display:block;margin-top:4px}
.kwrap{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:center}
.kwrap canvas.k2{width:70px;height:70px;border-radius:6px;margin:0}

footer{grid-area:bottom;display:flex;align-items:center;gap:14px;padding:8px 14px;border-top:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tools .lab{color:var(--muted);font-size:12.5px;margin-right:2px;white-space:nowrap}
#toolSeg .btn{flex:0 0 auto}
.tools input[type=range]{width:110px}
.tools output{font-family:var(--mono);font-size:12px;min-width:2.5em}
.stats{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.stats b{color:var(--text);font-weight:500}
.stats .slow b{color:var(--warn)}

#tabs{display:none}
.gsec{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin:8px 0 0;letter-spacing:.04em}
.gsec:first-child{margin-top:0}
.chip{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;color:#06120e;font-weight:800;flex:0 0 auto}
.chip.c0{background:#4cf2c7}.chip.c1{background:#ff6aa6}.chip.c2{background:#ffc94d}
.kcard{border:1px solid var(--line);border-radius:8px;padding:6px 8px 2px;margin-top:6px;cursor:pointer;background:#18191b}
.kcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.kh{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.kh b{color:var(--text);font-family:var(--mono);margin-right:2px}
.kh .kb{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.kcard .prow{margin:3px 0}
#chSeg .btn{flex:0 0 auto;padding:4px 8px}
#chSeg .btn.on .chip{box-shadow:0 0 0 2px #fff}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#overlay.on{display:flex}
#overlay .box{background:#121821;border:1px solid var(--line2);border-radius:14px;max-width:620px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:20px 22px;position:relative}
#overlay h3{margin:0 0 10px;font-size:18px}
#overlay h4{margin:16px 0 6px;color:var(--acc);font-size:14px}
#overlay p,#overlay li{color:#c9d0db;font-size:13.5px}
#overlay .close{position:absolute;right:10px;top:10px}
#overlay table{border-collapse:collapse;font-size:13px;width:100%}
#overlay td{padding:3px 6px;border-bottom:1px solid var(--line)}
#overlay td:first-child{font-family:var(--mono);color:var(--acc);white-space:nowrap;width:1%}
@media (hover:none){.kbonly{display:none}}
kbd{font-family:var(--mono);background:rgba(255,255,255,.08);border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-size:12px}
.math{font-family:var(--mono);background:rgba(255,255,255,.04);border-radius:6px;padding:8px 10px;color:#dfe6ef;font-size:12.5px;white-space:pre-wrap}

#testOut{position:fixed;inset:16px;z-index:30;background:#0e131a;border:1px solid var(--line2);border-radius:12px;overflow:auto;padding:16px 18px;display:none;font-size:13px}
#testOut .pass{color:#9ff0c9;margin:6px 0}
#testOut .fail{color:#ff9aa8;margin:6px 0}
#coach{position:absolute;left:12px;bottom:14px;max-width:min(340px,calc(100% - 24px));background:#1b1c1e;border:1px solid var(--acc);border-radius:12px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:3}
#coach p{margin:0 0 4px;font-size:13px;line-height:1.45}
#coach .row2{margin-top:6px}
.flash{animation:flash 1.1s ease 2}
@keyframes flash{50%{background:rgba(240,180,76,.2);border-radius:8px}}
#nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#ffd0d6}

/* ---------- phone / small tablet ---------- */
@media (max-width:899px){
  #app{height:auto;min-height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto 1fr;align-content:start;
    grid-template-areas:"top" "stage" "stats" "tabs" "panel"}
  header{padding:8px 10px;gap:8px}
  .hright{margin-left:auto}
  .ctrl{order:3;width:100%;justify-content:space-between}
  .speed input{width:auto;flex:1;min-width:60px}
  .speed{flex:1;min-width:0}
  #stage{aspect-ratio:1;width:100%;max-height:72vh}
  footer,#right{display:contents}
  .stats{grid-area:stats;margin:0;padding:6px 10px;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--bg2);gap:8px}
  #tabs{grid-area:tabs;display:flex;gap:4px;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  #tabs .btn{flex:1 1 0;min-width:0;padding:6px 4px}
  #left,#right>section,.tools{grid-area:panel;display:none}
  #left,#right>section{border:0;padding:12px;background:transparent;overflow:visible}
  .tools{padding:12px;gap:8px}
  body[data-tab=species] #left{display:block}
  body[data-tab=params] #secParams{display:block}
  body[data-tab=graphs] #secGraphs{display:block}
  body[data-tab=brush] .tools{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;align-content:start;gap:12px 10px}
  body[data-tab=brush] .tools input[type=range]{width:100%;min-width:0}
  .tools>.lab:first-child{display:none}
  #toolSeg,#chSeg,#toolHint{grid-column:1/-1}
  #toolSeg .btn{flex:1 1 auto}
  #right>section+section{margin-top:0}
  #gallery,#discFound{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
  .tools input[type=range]{flex:1;min-width:90px}
  #info{left:8px;top:8px;padding:6px 9px;max-width:calc(100% - 66px)}
  .speed output{min-width:3.4em}
  #viewBtns{right:8px;top:8px}
}
@media (max-width:420px){
  .brand{font-size:14px}
  .stats{font-size:11px}
  #hSpeedLab{display:none}
}
</style>
</head>
<body data-tab="species">
<div id="app">
  <header>
    <div class="brand">LENIA <b>LAB</b></div>
    <div class="ctrl">
      <button class="btn pri" id="playBtn" aria-label="play/pause">❚❚</button>
      <button class="btn icon" id="stepBtn" data-i18n-title="stepT">⏭</button>
      <label class="speed"><span id="hSpeedLab" data-i18n="speed">속도</span><input type="range" id="speed" min="0" max="7" step="1" value="4"><output id="speedOut"></output></label>
      <button class="btn" id="resetBtn" data-i18n="reset">⟲ 다시</button>
      <button class="btn" id="clearBtn" data-i18n="clear">비우기</button>
    </div>
    <div class="hright">
      <select id="gridSel" data-i18n-title="gridT"><option value="auto" selected>Auto</option><option value="128">128²</option><option value="256">256²</option><option value="512">512²</option><option value="1024">1024²</option></select>
      <select id="cmapSel" data-i18n-title="cmapT"></select>
      <button class="btn" id="langBtn">EN</button>
      <button class="btn icon" id="helpBtn" aria-label="help">?</button>
    </div>
  </header>

  <aside id="left" class="panel">
    <h2><span data-i18n="species">생물 도감</span><span class="sub" data-i18n="speciesSub">눌러서 불러오기</span></h2>
    <div id="gallery"></div>
    <div class="disc">
      <h2><span data-i18n="discTitle">신종 탐색</span></h2>
      <p class="hint" data-i18n="discHint"></p>
      <div class="row2"><button class="btn pri" id="discBtn"></button></div>
      <div class="dbar"><i id="discBar"></i></div>
      <canvas id="discView" width="128" height="128" hidden></canvas>
      <p class="hint" id="discStat"></p>
      <div id="discFound"></div>
    </div>
    <p class="hint" style="margin-top:10px" data-i18n="credit">생물 데이터: Bert Chan, Lenia (MIT)</p>
  </aside>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="info" title=""><div class="t" id="infoT"></div><div class="d" id="infoD"></div></div>
    <div id="viewBtns">
      <button class="btn icon" id="zin" aria-label="zoom in">+</button>
      <button class="btn icon" id="zout" aria-label="zoom out">−</button>
      <button class="btn icon" id="zfit" data-i18n-title="fitT">⤢</button>
      <button class="btn icon on" id="followBtn" data-i18n-title="followT">◎</button>
    </div>
    <div id="legend" hidden></div>
    <div id="badge"></div>
    <div id="toast"></div>
    <div id="nogl"></div>
    <div id="coach" hidden><p id="coachT"></p><div class="row2"><button class="btn pri" id="coachTry"></button><button class="btn" id="coachX"></button></div></div>
  </main>

  <aside id="right" class="panel">
    <section id="secParams">
      <h2><span data-i18n="params">파라미터</span><span class="sub" data-i18n="paramsSub">눈금 = 원래 값</span></h2>
      <div id="singleP">
      <div id="prows"></div>
      <div class="subh"><span data-i18n="rings">커널 고리 β</span><span><button class="btn icon" id="ringMinus" aria-label="-">−</button> <button class="btn icon" id="ringPlus" aria-label="+">+</button></span></div>
      <div class="rings" id="rings"></div>
      <div class="subh"><span data-i18n="kshape">커널 모양</span></div>
      <div class="seg" id="knSeg"><button class="btn" data-v="1" data-i18n="poly">다항식</button><button class="btn" data-v="2" data-i18n="bump">지수 봉우리</button></div>
      <div class="subh"><span data-i18n="gshape">성장 함수</span></div>
      <div class="seg" id="gnSeg"><button class="btn" data-v="1" data-i18n="poly">다항식</button><button class="btn" data-v="2" data-i18n="gauss">가우스</button></div>
      </div>
      <div id="multiP" hidden></div>
      <div id="flowP" hidden></div>
      <div class="row2">
        <button class="btn" id="restoreBtn" data-i18n="restore">원래 값으로</button>
        <button class="btn" id="linkBtn" data-i18n="link">링크 복사</button>
        <button class="btn" id="pngBtn" data-i18n="png">PNG 저장</button>
      </div>
    </section>
    <section id="secGraphs">
      <h2><span data-i18n="graphs">그래프</span></h2>
      <div class="gbox" id="boxK"><div class="gt"><span data-i18n="gK">커널 K — 이웃을 얼마나 보나</span><span id="gKv"></span></div>
        <div class="kwrap"><canvas class="k2" id="gK2"></canvas><canvas id="gK"></canvas></div></div>
      <div class="gbox" id="boxG"><div class="gt"><span data-i18n="gG">성장 G(U) + 지금 U 분포</span><span id="gGv"></span></div><canvas id="gG"></canvas>
        <p class="hint" data-i18n="gGhint"></p></div>
      <div class="gbox"><div class="gt"><span data-i18n="gM">질량 변화</span><span id="gMv"></span></div><canvas id="gM"></canvas></div>
      <div class="subh"><span data-i18n="edge">세상 가장자리</span></div>
      <div class="seg" id="edgeSeg"><button class="btn" data-v="wrap" data-i18n="eWrap">이어진 세상</button><button class="btn" data-v="wall" data-i18n="eWall">벽 있는 세상</button></div>

    helpHtml:`<h3>Lenia Lab</h3>

    helpHtml:`<h3>Lenia Lab</h3>
<p><b>Lenia</b> is a <b>continuous cellular automaton</b> created by Bert Chan in 2018. Unlike Conway's Game of Life, where cells are alive (1) or dead (0), each cell holds a real value between 0 and 1 that changes smoothly. Patterns end up swimming, spinning and holding their shape like microorganisms.</p>
<h4>The whole rule is two lines</h4>
<div class="math">U = K * A
  → weighted neighbor sum with kernel K
A ← clip(A + dt·G(U), 0, 1)
  → G is + near μ, − far from μ</div>
<p>Each cell looks at neighbors within radius R through a ring-shaped kernel K to get its density U. If U is close to μ (within σ) the cell grows; too little or too much and it shrinks. A creature is a moving solution where that balance keeps holding across its whole body.</p>
<h4>Things to try</h4>
<ul><li>Pick a species, then nudge <b>μ or σ</b>. It deforms, dies or explodes. The tick on each slider marks the original value.</li>
<li>In <b>Graphs</b>, check whether the cells' U values sit inside the shaded band — you can see why a creature dies.</li>
<li>With <b>Stamp</b> selected, click a species <b>once</b> to stamp it. Stamping a different species makes a 'mixed world' where each keeps its own rule. <b>Double-click</b> restarts with that species.</li>
<li><b>Flow Lenia</b> conserves mass: matter only flows, never appears or vanishes, so creatures stay together and settle into their own shapes. Each cell carries its own rule (h), so several species can meet and blend in one world.</li>
<li>Lay an <b>Obstacle course</b> and watch creatures squeeze between pillars, get cut or turn away.</li>
<li>Drop <b>Random soup</b> — sometimes creatures emerge by themselves.</li>
<li>The faint <b>blue lines</b> are the edge of the world. By default it wraps around, so a creature leaving one side comes back on the other; the dimmed area is a repeated copy. Switch to a walled world under <b>Graphs → World edge</b>.</li></ul>
<div class="kbonly"><h4>Shortcuts</h4>
<table><tr><td><kbd>Space</kbd></td><td>Play / pause</td></tr><tr><td><kbd>.</kbd></td><td>Single step</td></tr><tr><td><kbd>R</kbd></td><td>Reset current species</td></tr><tr><td><kbd>C</kbd></td><td>Clear</td></tr>

  { const save = { grid: S.grid };
    S.grid = 'auto'; loadSpecies(0); const a = S.N === 512 && world.N === 512 && !world.multi;
    loadMulti(5); const b = S.N === 256 && world.N === 256 && world.multi;
    S.grid = 1024; loadSpecies(0); world.step(20, KER, params()); const m = sum(world.read()); const c = world.N === 1024 && m > 60;
    S.grid = save.grid; loadSpecies(0);
    ok('38. 세상 크기: 자동 = 단일 512² · 다채널 256², 1024² 세상도 동작', a && b && c, `단일 ${a}, 다채널 ${b}, 1024² 질량 ${m.toFixed(1)}`); }
  // 39. mixed world: Orbium + Kronium in one world behave exactly as each would alone
  { const save = S.grid; S.grid = 256; loadSpecies(0); S.running = false; world.clear(); world.paint(2, { x: 70, y: 128, ang: 0, pat: patternTex(SPECIES[0]) });
    S.stampSp = 8; stampAt(190, 128, 0); const mixed = isMix() && S.rule.C === 2 && S.rule.R === 18 && Math.abs(S.rule.kernels[0].r - 13 / 18) < 1e-9;
    stepWorld(300); world.read(); const mm = world.chanMass();
    const solo = (i, x) => { const sp = SPECIES[i], w = mkW(256), K = gpuKernel(buildKernel(sp.R, parseB(sp.b), 1)); w.paint(2, { x, y: 128, ang: 0, pat: patternTex(sp) }); w.step(300, K, { m: sp.m, s: sp.s, T: sp.T, gn: 1 }); const m = sum(w.read()); freeKernel(K); return m; };
    const o = solo(0, 70), k = solo(8, 190), e1 = Math.abs(mm[0] / o - 1), e2 = Math.abs(mm[1] / k - 1);
    S.grid = save; S.stampSp = null; loadSpecies(0);
    ok('39. 섞인 세상: 오비움 + 크로니움이 한 세상에서 각자 혼자일 때와 같게 산다 (300스텝)', mixed && e1 < 1e-3 && e2 < 1e-3, `채널 질량 ${mm[0].toFixed(2)} / ${mm[1].toFixed(2)} vs 혼자 ${o.toFixed(2)} / ${k.toFixed(2)} (오차 ${(e1 * 100).toFixed(3)}% / ${(e2 * 100).toFixed(3)}%)`); }
  // 40. Flow Lenia: GPU == CPU (A and embedded h), torus + wall
  { const N = 32, rule = { R: 0, dt: 0.2, sd: 0.65, kernels: [{ r: 0.5, m: 0.15, s: 0.02, a: [0.2, 0.5, 0.8], b: [0.6, 1, 0.3], w: [0.05, 0.1, 0.05] }, { r: 0.35, m: 0.3, s: 0.05, a: [0.1, 0.6, 0.9], b: [1, 0.4, 0.7], w: [0.1, 0.03, 0.2] }] };
    const FK = buildFlowKernel(rule), r = rnd(21), A0 = new Float32Array(N * N), P0 = new Float32Array(N * N * 4);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const i = y * N + x; if (Math.abs(x - 10) < 7 && Math.abs(y - 16) < 7) { A0[i] = r(); P0[i * 4] = 1; P0[i * 4 + 1] = 0.3; } else if (Math.abs(x - 24) < 5 && Math.abs(y - 9) < 5) { A0[i] = r() * 1.5; P0[i * 4] = 0.2; P0[i * 4 + 1] = 1; } }
    const det = []; let pass = true;
    for (const wall of [false, true]) { let A = A0, P = P0; for (let i = 0; i < 4; i++) ({ A, P } = flowCpuStep(A, P, N, FK, rule, wall));
      const w = new FlowWorld(N); tw.push(w); w.wall = wall; w.setState(A0, P0); w.step(4, FK, rule); const dA = maxDiff(A, w.read()), dP = maxDiff(P, w.readP());
      if (!(dA < 1e-4 && dP < 1e-4)) pass = false; det.push(`${wall ? '벽' : '이어짐'}: A 오차 ${dA.toExponential(1)}, h 오차 ${dP.toExponential(1)}`); }
    gl.deleteTexture(FK.tex);
    ok('40. Flow Lenia: GPU = CPU 기준 구현 (질량 A + 칸마다 h, 이어짐/벽)', pass, det.join(' · ') + ` · 탭 ${FK.n}개`); }
  // 41. Flow Lenia conserves mass (torus + wall, 600 steps) and the soup stays localised
  { const N = 128, rule = { R: 0, dt: 0.2, sd: 0.65, kernels: [{ r: 0.6, m: 0.2, s: 0.04, a: [0.3, 0.6, 0.9], b: [1, 0.5, 0.2], w: [0.08, 0.08, 0.08] }] }, FK = buildFlowKernel(rule);
    const det = []; let pass = true;
    for (const wall of [false, true]) { const w = new FlowWorld(N); tw.push(w); w.wall = wall; w.paintFlow(2, { x: wall ? 8 : 64, y: 64, r: 20, amt: 1, seed: 0.37, h: [1, 0, 0, 0] });
      const m0 = sum(w.read()); w.step(600, FK, rule); const A = w.read(), m1 = sum(A), err = Math.abs(m1 / m0 - 1);
      let outside = 0; if (wall) for (let i = 0; i < A.length; i++) if (!isFinite(A[i]) || A[i] < 0) outside++;
      if (!(err < 1e-4) || outside) pass = false; det.push(`${wall ? '벽' : '이어짐'}: 질량 ${m0.toFixed(2)} → ${m1.toFixed(2)} (변화 ${(err * 100).toExponential(1)}%)`); await tick(); }
    gl.deleteTexture(FK.tex);
    ok('41. Flow Lenia: 질량 보존 (600스텝, 이어짐/벽)', pass, det.join(' · ')); }
  // 42. Flow presets: from their random start, each settles to the recorded size (rg ±5 %) with mass conserved
  { let pass = true; const det = [];
    for (const f of FLOWP) { const w = new FlowWorld(f.N); tw.push(w); const FK = buildFlowKernel(f.rule);
      for (const o of f.init) { const h = f.H[o.sp].slice(0, 4); while (h.length < 4) h.push(0); w.paintFlow(2, { x: f.N / 2 + o.x, y: f.N / 2 + o.y, r: o.r, amt: 1, seed: o.seed, h }); }
      const m0 = sum(w.read()); w.step(1500, FK, f.rule); const A = w.read(), m1 = sum(A), s0 = measure(A, f.N); let r2 = 0;
      for (let y = 0; y < f.N; y++) for (let x = 0; x < f.N; x++) { const a = A[y * f.N + x]; if (a) r2 += a * (torusDelta(s0.x, x, f.N) ** 2 + torusDelta(s0.y, y, f.N) ** 2); }
      const rg = Math.sqrt(r2 / m1), good = Math.abs(rg / f.rg1500 - 1) < 0.05 && Math.abs(m1 / m0 - 1) < 1e-4 && Math.abs(m0 / f.mass - 1) < 1e-3;
      if (!good) pass = false; det.push(`${f.en.name}: 반경 ${rg.toFixed(1)} (기록 ${f.rg1500}), 질량 ${(m1 / m0).toFixed(6)}${good ? '' : ' ✘'}`); gl.deleteTexture(FK.tex); await tick(); }
    ok('42. Flow 프리셋 5종: 무작위 덩어리에서 기록된 모양 크기로 정리 + 질량 보존 (1500스텝)', pass, det.join(' · ')); }
  } catch (e) { ok('예외 발생', false, String(e && e.stack || e)); }
  for (const w of tw) w.dispose();
  const nPass = out.filter(o => o.pass).length;
  box.innerHTML = `<h3 style="margin-top:0">${t('testsTitle')}: ${nPass} / ${out.length} ${LANG === 'ko' ? '통과' : 'passed'}</h3>` + out.map(o => `<div class="${o.pass ? 'pass' : 'fail'}">${o.pass ? '✔' : '✘'} <b>${o.name}</b><br><span style="color:var(--muted)">${o.detail}</span></div>`).join('') + `<p><button class="btn" onclick="this.closest('#testOut').style.display='none'">${t('close')}</button></p>`;
  document.title = `TESTS ${nPass}/${out.length} ${nPass === out.length ? 'PASS' : 'FAIL'}`;
  window.__testResults = out;
}

/* ===================== BOOT ===================== */
(async function boot() {
  SPECIES.forEach(sp => { sp.id = sp.name.toLowerCase().replace(/[^a-z]+/g, '-'); });
  MSPECIES.forEach(ms => { ms.id = 'm-' + ms.en.name.toLowerCase().replace(/[^a-z]+/g, '-'); });
  BUILTIN = SPECIES.length; NMS = MSPECIES.length;
  for (const e of SHOW) { e.id = 'show-' + e.en.name.toLowerCase().replace(/[^a-z]+/g, '-'); MSPECIES.push(e); }
  MIXI = MSPECIES.push({ mix: true, id: 'mix', name: 'mixed world', members: [], params: [], cells: [], ko: { name: '', desc: '' }, en: { name: '', desc: '' } }) - 1;
  for (const e of ECO) { e.id = 'eco-' + e.eco; e.name = 'Orbium × Orbium · ' + e.eco; MSPECIES.push(e); }
  if (!gl || !FMT) { const n = $('#nogl'); n.style.display = 'flex'; n.textContent = t('noGL'); syncText(); return; }
  try { initGL(); } catch (e) { const n = $('#nogl'); n.style.display = 'flex'; n.textContent = t('noGL') + ' (' + e.message + ')'; console.error(e); return; }
  try { const c = localStorage.getItem('leniaCmap'); if (CMAPS[c]) S.cmap = c; } catch (e) {}
  setLUT(S.cmap);
  buildParams(); if (!TESTING) loadMine(); buildGallery(); bindUI(); syncTabs(); resize(); renderFinds();
  $('#discBtn').onclick = toggleDiscovery;
  newWorld(S.N);
  syncText();
  if (matchMedia('(max-width: 599px)').matches) $('#info').classList.add('min');   // phones: title only, tap for the description
  NARROW.addEventListener('change', syncSpeed);
  if (!applyHash()) loadSpecies(0);
  $('#cmapSel').addEventListener('change', () => { try { localStorage.setItem('leniaCmap', S.cmap); } catch (e) {} });
  requestAnimationFrame(frame); maybeCoach();
  if (TESTING) { await runTests(); loadSpecies(0); TESTING_DONE(); }
})();
function TESTING_DONE() { /* tests finished: keep the page paused so results stay readable */ S.running = false; syncPlay(); TESTING = false; window.__testingDone = true; }
</script>
